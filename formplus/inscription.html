  <main class="container my-4 flex-grow-1">
    <h1 class="h3 mb-4">Bienvenue sur FormaPlus</h1>
    <!-- Contenu de la page -->
     <form id="formInscription" class="form-page" action="#" method="get">
  <h2 class="h5 mb-3"><i class="bi bi-person-vcard"></i> Informations personnelles</h2>

  <div class="mb-3">
    <label for="nom" class="form-label">Nom</label>
    <input type="text" class="form-control" id="nom" name="nom" placeholder="Votre nom">
  </div>
  
  <!-- Q2.2 : compléter avec les autres champs -->
  <div class="mb-3">
      <label for="prenom" class="form-label">Prenom</label>
      <input type="text" class="form-control" id="prenom" name="prenom" placeholder="Votre Prenom">
    </div>
    <div class="mb-3">
      <label for="nom" class="form-label">Adresse e-mail</label>
      <input type="mail" class="form-control" id="email" name="email" placeholder="Votre nom@exemple.com">
    </div>
    <div class="mb-3">
      <label for="mdp" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="mdp" name="mdp" placeholder="____">
    </div>
    <div class="mb-3">
      <label for="tel" class="form-label">Téléphone</label>
      <input type="text" class="form-control" id="tel" name="tel" placeholder=" 20 123 456">
    </div>
    <div class="mb-3">
      <label for="naissance" class="form-label">Date de naissance</label>
      <input type="date" class="form-control" id="naissance" name="naissance" placeholder=" ____">
    </div>
    <div class="mb-3">
      <label for="age" class="form-label">Age</label>
      <input type="number" min="16" max="60" class="form-control" id="age" name="age" placeholder="minimum 16ans max 60ans">
    </div>
    <div class="mb-3">
      <label for="site" class="form-label">Site web ou profil LinkedIn</label>
      <input type="url" class="form-control" id="site" name="site" placeholder=" Site web ou profil LinkedIn">
    </div>
    <div class="mb-3">
      <label for="heure" class="form-label">Heure de disponibilité pour un appel</label>
      <input type="time" class="form-control" id="heure" name="heure" placeholder=" Heure de disponibilité pour un appel">
    </div>
    <section class="mb-4">

    <h2 class="h5 mb-3">
        <i class="bi bi-mortarboard"></i>
        Formation souhaitée
    </h2>
    <select class="form-select">
    <option value="0">choisir</option>
    <option value="1">Développement web</option>
    <option value="2">Développement mobile</option>
    <option value="3">Réseaux</option>
    <option value="4">Bureautique</option></select>
    </section>
    <div class="mb-3">
 

</div>
    <div class="mb-3">
        <label class="form-label">Langages déjà pratiqués</label>
    
        <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   name="langages[]" value="HTML" id="html">
            <label class="form-check-label" for="html">HTML</label>
        </div>
      
        <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   name="langages[]" value="CSS" id="css">
            <label class="form-check-label" for="css">CSS</label>
        </div>
      
        <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   name="langages[]" value="JavaScript" id="javascript">
            <label class="form-check-label" for="javascript">JavaScript</label>
        </div>
      
        <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   name="langages[]" value="PHP" id="php">
            <label class="form-check-label" for="php">PHP</label>
        </div>
      
        <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   name="langages[]" value="Dart" id="dart">
            <label class="form-check-label" for="dart">Dart</label>
        </div>
      
        <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   name="langages[]" value="Python" id="python">
            <label class="form-check-label" for="python">Python</label>
        </div>
    </div>
    <div>
      <label for="">Motivation: </label><br><br>
      <textarea name="" rows="4" id="" placeholder="Lettre de motivation"></textarea>
    </div>
    <label for="exampleDataList" class="form-label">Votre Ville</label>
<input class="form-control" list="datalistOptions" id="exampleDataList" placeholder="Votre ville...">

<datalist id="datalistOptions">
  <option value="Tunis">
  <option value="Nabeul">
  <option value="Sousse">
  <option value="Sfax">
  <option value="Bizerte">
  <option value="Monastir">
</datalist><br><br>
     <!-- reste Q2.7 -->

    <button type="submit" class="btn btn-primary">Envoyer</button>
  </form>
